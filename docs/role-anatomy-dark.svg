<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470">
  <style>
    .mono { font-family: "JetBrains Mono", "IBM Plex Mono", "Menlo", monospace; }
    .cond { font-family: "Barlow Condensed", "DIN Condensed", "Arial Narrow", sans-serif; font-weight: 700; text-transform: uppercase; }
  </style>
<rect width="1500" height="470" fill="#0a0d1e"/>
<text class="cond" x="48.0" y="56.0" text-anchor="start" font-size="30" fill="#edf0fc" letter-spacing="2">ANATOMY OF A ROLE</text>
<text class="mono" x="48.0" y="80.0" text-anchor="start" font-size="11" fill="#8a93c4" letter-spacing="1">roles/do178c-cert-engineer/ — one role, four load-bearing parts</text>
<rect x="48" y="110" width="380" height="62" fill="#111632" stroke="#38bdf8" stroke-width="1.8"/>
<rect x="48" y="110" width="6" height="62" fill="#38bdf8"/>
<text class="mono" x="70.0" y="147.0" text-anchor="start" font-size="12" fill="#edf0fc" letter-spacing="1">ROLE.md · FRONTMATTER</text>
<line x1="432" y1="141" x2="472" y2="141" stroke="#edf0fc" stroke-width="1.3"/>
<path d="M 480 141 l -9 -4.5 v 9 Z" fill="#edf0fc"/>
<text class="mono" x="496.0" y="136.0" text-anchor="start" font-size="11.5" fill="#8a93c4">identity, deliverable type, bound standards + skills —</text>
<text class="mono" x="496.0" y="154.0" text-anchor="start" font-size="11.5" fill="#8a93c4">the machine-readable contract manifest.json is generated from.</text>
<rect x="48" y="192" width="380" height="62" fill="#111632" stroke="#a78bfa" stroke-width="1.8"/>
<rect x="48" y="192" width="6" height="62" fill="#a78bfa"/>
<text class="mono" x="70.0" y="229.0" text-anchor="start" font-size="12" fill="#edf0fc" letter-spacing="1">ROLE.md · BODY</text>
<line x1="432" y1="223" x2="472" y2="223" stroke="#edf0fc" stroke-width="1.3"/>
<path d="M 480 223 l -9 -4.5 v 9 Z" fill="#edf0fc"/>
<text class="mono" x="496.0" y="218.0" text-anchor="start" font-size="11.5" fill="#8a93c4">the workflow the agent follows: ordered stages, an evidence</text>
<text class="mono" x="496.0" y="236.0" text-anchor="start" font-size="11.5" fill="#8a93c4">gate per stage, forbidden actions, the human sign-off stop.</text>
<rect x="48" y="274" width="380" height="62" fill="#111632" stroke="#f472b6" stroke-width="1.8"/>
<rect x="48" y="274" width="6" height="62" fill="#f472b6"/>
<text class="mono" x="70.0" y="311.0" text-anchor="start" font-size="12" fill="#edf0fc" letter-spacing="1">core/*_core.py + cli.py</text>
<line x1="432" y1="305" x2="472" y2="305" stroke="#edf0fc" stroke-width="1.3"/>
<path d="M 480 305 l -9 -4.5 v 9 Z" fill="#edf0fc"/>
<text class="mono" x="496.0" y="300.0" text-anchor="start" font-size="11.5" fill="#8a93c4">the executable domain engine — computes the real deliverable</text>
<text class="mono" x="496.0" y="318.0" text-anchor="start" font-size="11.5" fill="#8a93c4">content offline, stdlib only, no network calls.</text>
<rect x="48" y="356" width="380" height="62" fill="#111632" stroke="#fb923c" stroke-width="1.8"/>
<rect x="48" y="356" width="6" height="62" fill="#fb923c"/>
<text class="mono" x="70.0" y="393.0" text-anchor="start" font-size="12" fill="#edf0fc" letter-spacing="1">tests/ + templates/ + SOURCES.md</text>
<line x1="432" y1="387" x2="472" y2="387" stroke="#edf0fc" stroke-width="1.3"/>
<path d="M 480 387 l -9 -4.5 v 9 Z" fill="#edf0fc"/>
<text class="mono" x="496.0" y="382.0" text-anchor="start" font-size="11.5" fill="#8a93c4">offline behavior contract (gate 2 replays it), original</text>
<text class="mono" x="496.0" y="400.0" text-anchor="start" font-size="11.5" fill="#8a93c4">deliverable skeleton, and standards referenced (summary-not-copy).</text>
<text class="mono" x="48.0" y="444.0" text-anchor="start" font-size="10.5" fill="#8a93c4" letter-spacing="2">PLAIN FILES, OPEN AGENTSKILLS.IO-ADJACENT FORMAT · ANY ROLE.MD-AWARE HOST CAN LOAD THEM</text>
<text class="mono" x="1452.0" y="444.0" text-anchor="end" font-size="9.5" fill="#8a93c4" letter-spacing="1.5" opacity="0.9">AERO AGENT ROLES · ASHFORDE OÜ</text>
</svg>
